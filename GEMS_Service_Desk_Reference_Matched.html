<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GEMS Service Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* ==============================================================
     GEMS SERVICE DESK — visual system v3 "dispatch board"
     A receiving-dock status board: near-black surfaces, LED-style
     status dots, monospace department codes (DEPT 01, DEPT 02…),
     and bright signal colors per department/status instead of paper
     and ink stamps. Every department keeps one fixed accent color
     end to end — its tile, its badges, its icon — so the color
     itself becomes the way people recognize a department at a glance.
     ============================================================== */
  :root{
    --bg0:#0c0e12; --bg1:#111319; --panel:#15181e; --panel-2:#1a1d24;
    --line:#2c313c; --line-strong:#454b59; --text:#f7f5ef; --text-dim:#c2c6ce; --text-mute:#8b909a;
    --ruby:#ff6b4f; --ruby-deep:#ff4530; --amber:#ffc169; --signal:#5c9ee8; --moss:#7fe8ca;
    --slate:#c2c6ce; --slate-light:#8b909a;
    --font-display:'Barlow Condensed','Arial Narrow',sans-serif;
    --font-body:'Manrope','Inter',system-ui,sans-serif;
    --font-mono:'IBM Plex Mono','Courier New',monospace;
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:var(--font-body);color:var(--text);
    background-color:var(--bg0);
    background-image:linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size:34px 34px;
  }
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;font-size:14px;}
  #root{min-height:100vh;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
  }

  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0;}
  .pill, .tag{
    display:inline-flex;align-items:center;gap:6px;
    font-family:var(--font-mono);font-size:11px;font-weight:600;
    text-transform:uppercase;letter-spacing:.08em;
    border-radius:4px;padding:3px 9px 3px 8px;
    position:relative;
    animation:stampIn .28s var(--ease) both;
  }
  @keyframes stampIn{
    0%{ opacity:0; transform:scale(.85) translateY(2px); }
    100%{ opacity:1; transform:scale(1) translateY(0); }
  }
  .pill{border:1px solid currentColor;background:transparent;}
  .tag{border:1px solid currentColor;opacity:.95;}
  .cat-chip{font-size:11px;padding:4px 10px;border-radius:4px;background:var(--panel-2);border:1px solid var(--line);color:var(--text-dim);font-family:var(--font-mono);letter-spacing:.03em;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;transition:border-color .15s var(--ease),transform .15s var(--ease);}
  .btn{border:none;border-radius:8px;font-weight:700;padding:10px 18px;font-size:14px;display:inline-flex;align-items:center;gap:8px;transition:transform .12s var(--ease),filter .12s var(--ease),background .12s var(--ease);}
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:linear-gradient(135deg,#ff7a5c,#e2412e);color:#fff;box-shadow:0 10px 24px -8px rgba(226,65,46,.6);}
  .btn-primary:hover{filter:brightness(1.06);transform:translateY(-1px);box-shadow:0 12px 28px -8px rgba(226,65,46,.75);}
  .btn-dark{background:var(--panel-2);color:var(--text);border:1px solid var(--line-strong);}
  .btn-dark:hover{transform:translateY(-1px);border-color:var(--text-mute);}
  .btn-muted{background:var(--panel-2);color:var(--text-dim);border:1px solid var(--line-strong);}
  .btn-muted:hover{transform:translateY(-1px);color:var(--text);}
  .btn-ghost{background:transparent;border:1px solid var(--line-strong);color:var(--text);}
  .btn-ghost:hover{border-color:var(--text-dim);background:var(--panel-2);}
  .btn:disabled{opacity:.5;cursor:default;transform:none;}
  .eyebrow{font-family:var(--font-mono);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--ruby);margin-bottom:5px;}
  .h-title{font-family:var(--font-display);font-weight:800;font-size:31px;letter-spacing:.001em;color:var(--text);}
  .h-subtitle{font-family:var(--font-body);font-size:14px;color:var(--text-dim);margin-top:6px;}
  .field-label{font-family:var(--font-mono);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);display:block;margin-bottom:6px;}
  .input, select.input, textarea.input{width:100%;border:1px solid var(--line-strong);border-radius:8px;padding:10px 14px;outline:none;background:var(--panel-2);color:var(--text);transition:border-color .12s var(--ease);}
  .input::placeholder{color:var(--text-mute);}
  .input:focus{border-color:var(--ruby);}
  .input-sm{border:1px solid var(--line-strong);border-radius:7px;padding:7px 10px;outline:none;background:var(--panel-2);color:var(--text);font-size:13px;width:100%;}
  .input-sm:focus{border-color:var(--ruby);}
  .mono{font-family:var(--font-mono);}
  select.input option{background:var(--panel-2);color:var(--text);}


  /* ---------- login : reference-matched split screen ---------- */
  .login-wrap{
    min-height:100vh;
    display:grid;
    grid-template-columns:50% 50%;
    background:#fff;
    color:#12151b;
    position:relative;
    overflow:hidden;
  }

  .login-left{
    min-height:100vh;
    background:#fff;
    display:flex;
    flex-direction:column;
    position:relative;
    padding:36px clamp(34px,4.2vw,68px) 26px;
    overflow:auto;
  }

  .login-brand{
    display:flex;
    align-items:center;
    gap:12px;
    width:max-content;
    user-select:none;
  }
  .login-brand-mark{
    width:54px;height:54px;
    border-radius:11px;
    overflow:hidden;
    background:#17191f;
    box-shadow:0 5px 16px rgba(16,18,24,.14);
    flex-shrink:0;
  }
  .login-brand-mark img{
    width:100%;height:100%;
    display:block;
    object-fit:cover;
  }
  .login-brand-copy{
    display:flex;
    flex-direction:column;
    line-height:.84;
  }
  .login-brand-title{
    font-family:var(--font-display);
    font-size:26px;
    font-weight:800;
    color:#12151b;
    letter-spacing:.015em;
  }
  .login-brand-sub{
    margin-top:4px;
    font-family:var(--font-display);
    font-size:12px;
    font-weight:800;
    color:#12151b;
    letter-spacing:.07em;
  }

  .login-left-body{
    width:100%;
    max-width:535px;
    margin:auto;
    padding:42px 0 34px;
  }

  .login-card{
    background:transparent;
    border:none;
    border-radius:0;
    padding:0;
    position:relative;
    animation:cardIn .3s var(--ease) both;
    box-shadow:none;
  }
  .login-card h1{
    font-family:var(--font-body);
    font-weight:800;
    font-size:clamp(38px,3vw,48px);
    line-height:1.08;
    margin:0 0 11px;
    color:#101218;
    letter-spacing:-.035em;
  }
  .login-card p.sub{
    font-size:16px;
    color:#747a85;
    margin:0 0 34px;
    line-height:1.55;
  }

  /* The reference layout does not show the old ticket tag. Keep the
     markup for compatibility, but hide it visually on the login page. */
  .login-left .login-stub-tag{display:none;}

  .login-choice-btn{
    width:100%;
    min-height:70px;
    justify-content:space-between;
    font-family:var(--font-body);
    letter-spacing:-.012em;
    font-size:17px;
    padding:0 22px;
    border-radius:10px;
    transition:transform .14s var(--ease), box-shadow .14s var(--ease), border-color .14s var(--ease);
  }
  .login-choice-left{display:flex;align-items:center;gap:15px;}
  .login-choice-btn.btn-primary{
    background:linear-gradient(135deg,#ff5d43 0%,#ef2f2f 100%);
    color:#fff;
    border:1px solid transparent;
    box-shadow:0 14px 30px -18px rgba(239,47,47,.8);
  }
  .login-choice-btn.btn-primary:hover{
    transform:translateY(-2px);
    filter:none;
    box-shadow:0 18px 34px -17px rgba(239,47,47,.88);
  }
  .login-choice-btn.btn-ghost{
    background:#fff;
    color:#20242c;
    border:1px solid #d7dbe2;
    box-shadow:0 8px 22px -20px rgba(16,18,24,.45);
  }
  .login-choice-btn.btn-ghost:hover{
    background:#fafbfc;
    color:#101318;
    border-color:#bcc2cc;
    transform:translateY(-2px);
  }

  .login-left .hint-box{
    margin-top:26px;
    font-size:14px;
    line-height:1.58;
    color:#354153;
    background:#f4f8ff;
    border-radius:11px;
    padding:17px 18px;
    display:none;
    border:1px solid #b7d3fb;
    gap:12px;
    align-items:flex-start;
  }
  .login-left .hint-box.show{display:flex;}
  .login-left .hint-box .hi{
    flex-shrink:0;
    width:23px;height:23px;border-radius:50%;
    border:1.5px solid #2f80ed;color:#2f80ed;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-mono);font-size:11px;font-weight:700;margin-top:1px;
  }

  .login-left .field-label{
    font-family:var(--font-body);
    font-size:14px;
    font-weight:700;
    text-transform:none;
    letter-spacing:0;
    color:#262a31;
    margin-bottom:8px;
  }
  .login-left .input,
  .login-left select.input,
  .login-left textarea.input{
    width:100%;
    border:1px solid #d6dae1;
    border-radius:8px;
    padding:14px 15px;
    outline:none;
    background:#fff;
    color:#171a20;
    transition:border-color .12s var(--ease), box-shadow .12s var(--ease);
  }
  .login-left .input::placeholder{color:#9da3ad;}
  .login-left .input:focus{
    border-color:#ef3b35;
    box-shadow:0 0 0 3px rgba(239,59,53,.10);
  }
  .login-left .form-row{margin-bottom:19px;}
  .login-left .err-box{
    background:#fff2f1;color:#cf2e27;font-size:12px;font-weight:700;
    border-radius:8px;padding:10px 12px;margin-bottom:14px;display:none;
    border:1px solid #ffc9c5;
  }
  .login-left .err-box.show{display:block;}
  .login-left .btn-dark{
    background:#11151c;color:#fff;border:1px solid #11151c;
    min-height:52px;
    box-shadow:0 12px 26px -18px rgba(0,0,0,.55);
  }
  .login-left .btn-dark:hover{background:#05070a;border-color:#05070a;color:#fff;}
  .login-left .back-link{
    color:#737b86;
    font-family:var(--font-body);
    font-size:13px;
    font-weight:700;
    text-transform:none;
    letter-spacing:0;
    margin-bottom:24px;
  }
  .login-left .back-link:hover{color:#e93432;}

  .login-footer{
    width:100%;
    max-width:535px;
    margin:0 auto;
    padding-top:18px;
    border-top:1px solid #eceef2;
    color:#7c828c;
    font-size:11.5px;
    font-family:var(--font-mono);
    letter-spacing:.025em;
    display:flex;
    align-items:center;
    gap:8px;
    justify-content:flex-start;
  }

  .login-right{
    min-height:100vh;
    position:relative;
    overflow:hidden;
    background-color:#0c0e12;

  .login-right::after{
    content:'';
    position:absolute;
    inset:0;
    box-shadow:inset 16px 0 30px rgba(0,0,0,.08);
    pointer-events:none;
  }

  .loading-txt{color:#111318;font-size:13px;font-weight:600;text-align:center;}

  /* Sidebar logo styles retained for the authenticated app. */
  .logo-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:32px;position:relative;}
  .logo-row-photo{margin-bottom:26px;}
  .logo-row-photo-big{margin-bottom:36px;}
  .logo-photo-glow{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(255,69,48,.28) 0%, rgba(255,69,48,.1) 45%, rgba(255,69,48,0) 72%);
    filter:blur(10px);pointer-events:none;z-index:0;
    animation:logoGlowPulse 3.6s ease-in-out infinite;
  }
  @keyframes logoGlowPulse{
    0%,100%{opacity:.7;transform:translate(-50%,-50%) scale(1);}
    50%{opacity:1;transform:translate(-50%,-50%) scale(1.06);}
  }
  .logo-photo-img{
    position:relative;z-index:1;display:block;border-radius:16px;
    filter:drop-shadow(0 12px 26px rgba(0,0,0,.55)) drop-shadow(0 0 10px rgba(255,69,48,.3));
    transition:transform .2s var(--ease),filter .2s var(--ease);
  }
  .sidebar .logo-row-photo:hover .logo-photo-img{transform:translateY(-1px) scale(1.03);filter:drop-shadow(0 10px 20px rgba(0,0,0,.5)) drop-shadow(0 0 12px rgba(255,69,48,.4));}
  .logo-row-icon{gap:10px;margin-bottom:0;justify-content:flex-start;}
  .logo-icon-img{width:50px;height:50px;border-radius:12px;object-fit:cover;position:relative;z-index:1;display:block;box-shadow:0 4px 12px rgba(0,0,0,.5);transition:transform .15s var(--ease);}
  .logo-icon-glow{
    position:absolute;left:16px;top:50%;transform:translateY(-50%);
    width:52px;height:52px;border-radius:50%;
    background:radial-gradient(circle, rgba(255,69,48,.32) 0%, rgba(255,69,48,0) 70%);
    filter:blur(6px);pointer-events:none;z-index:0;
  }
  .logo-row-icon:hover .logo-icon-img{transform:scale(1.05);}
  .logo-row-full{margin-bottom:36px;justify-content:center;}
  .logo-full-img{height:170px;width:auto;display:block;border-radius:16px;box-shadow:0 12px 30px rgba(0,0,0,.55);}
  @media (prefers-reduced-motion: reduce){ .logo-photo-glow{animation:none;} }

  @media (max-width:1050px){
    .login-left{padding-left:40px;padding-right:40px;}
    .login-left-body,.login-footer{max-width:470px;}
    .login-card h1{font-size:40px;}
  }
  @media (max-width:860px){
    .login-wrap{display:block;background:#fff;overflow:auto;}
    .login-left{min-height:100vh;padding:28px 28px 24px;}
    .login-right{display:none;}
    .login-left-body{max-width:520px;padding:56px 0 40px;}
    .login-footer{max-width:520px;}
    .login-card h1{font-size:38px;}
  }
  @media (max-width:520px){
    .login-left{padding:22px 20px;}
    .login-brand-mark{width:48px;height:48px;}
    .login-brand-title{font-size:23px;}
    .login-brand-sub{font-size:10.5px;}
    .login-left-body{padding:46px 0 30px;}
    .login-card h1{font-size:32px;}
    .login-choice-btn{min-height:64px;padding:0 16px;font-size:15.5px;}
  }


  /* ---------- app shell ---------- */
  .app-shell{display:flex;min-height:100vh;}
  .sidebar{
    width:246px;flex-shrink:0;display:flex;flex-direction:column;padding:18px 16px;
    border-right:1px solid var(--line);position:relative;overflow:hidden;
    background-color:var(--bg1);
  }
  .sidebar::after{
    content:'';position:absolute;left:0;right:0;bottom:0;height:80px;
    background:linear-gradient(0deg, rgba(255,90,60,.08), transparent);pointer-events:none;
  }
  .sidebar .logo-row{justify-content:flex-start;margin:0 0 22px 0;}
  .nav{display:flex;flex-direction:column;gap:4px;flex:1;position:relative;z-index:1;}
  .nav-item{display:flex;align-items:center;justify-content:space-between;gap:10px;border:none;background:transparent;border-radius:8px;padding:10px 12px;font-size:14px;font-weight:600;color:var(--text-dim);width:100%;text-align:left;transition:background .12s var(--ease),color .12s var(--ease);position:relative;overflow:hidden;}
  .nav-item::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--ruby);transform:scaleY(0);transition:transform .15s var(--ease);}
  .nav-item .nav-left{display:flex;align-items:center;gap:10px;}
  .nav-item:hover{background:var(--panel);color:var(--text);}
  .nav-item:hover::before{transform:scaleY(.5);}
  .nav-item.active{background:rgba(255,90,60,.14);color:var(--ruby);}
  .nav-item.active::before{transform:scaleY(1);}
  .nav-badge{font-family:var(--font-mono);font-size:10px;font-weight:700;border-radius:3px;background:var(--ruby);color:#1a0a05;padding:2px 6px;}
  .side-user{background:var(--panel);border-radius:8px;padding:12px;margin-top:10px;border:1px solid var(--line);position:relative;z-index:1;}
  .side-user-top{display:flex;align-items:center;gap:10px;}
  .side-avatar{width:34px;height:34px;border-radius:50%;background:var(--panel-2);color:var(--text);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;border:1px solid var(--line-strong);}
  .side-user-divider{height:1px;background:var(--line);margin:10px 0;}
  .side-user .d{font-family:var(--font-body);font-size:14px;font-weight:700;color:var(--text);letter-spacing:.005em;}
  .side-user .u{font-family:var(--font-body);font-size:12px;color:var(--text-mute);margin-top:1px;}
  .side-user button{border:none;background:transparent;color:var(--ruby);font-size:12px;font-weight:700;padding:0;display:flex;align-items:center;gap:5px;}
  .nav-divider{height:1px;background:var(--line);margin:10px 4px;position:relative;z-index:1;}

  .main{flex:1;overflow-y:auto;background-color:var(--bg0);background-image:linear-gradient(rgba(12,14,18,.82),rgba(12,14,18,.88)),url('/images/Background.png');background-size:cover;background-position:center;background-repeat:no-repeat;background-attachment:fixed;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:15px 32px;border-bottom:1px solid var(--line);background:var(--bg1);position:relative;}
  .topbar .tb-left{font-family:var(--font-mono);font-size:11px;letter-spacing:.03em;color:var(--text-mute);}
  .topbar .tb-refresh{border:none;background:transparent;font-size:12px;font-weight:700;color:var(--text-dim);display:flex;align-items:center;gap:6px;}
  .topbar .tb-refresh:hover{color:var(--text);}
  .content{padding:32px;animation:contentIn .24s var(--ease) both;}
  @keyframes contentIn{ from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }
  @keyframes cardIn{ from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }
  @keyframes tileIn{ from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }

  .section-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px;}

  .stat-grid{display:grid;gap:16px;margin-bottom:24px;}
  .stat-grid.g3{grid-template-columns:repeat(3,1fr);}
  .stat-grid.g4{grid-template-columns:repeat(4,1fr);}
  .stat-card{padding:18px;position:relative;overflow:hidden;transition:transform .15s var(--ease),border-color .15s var(--ease);}
  .stat-card:hover{transform:translateY(-2px);border-color:var(--line-strong);}
  .stat-card::after{content:'';position:absolute;top:14px;right:14px;width:8px;height:8px;border-radius:50%;background:currentColor;}
  .stat-card .lbl{display:flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin-bottom:10px;}
  .stat-card .val{font-family:var(--font-display);font-weight:800;font-size:36px;color:var(--text);line-height:1;}

  .list-header{display:grid;grid-template-columns:1.1fr 2fr 1.2fr 1.3fr 1.1fr 1.1fr 0.9fr;gap:10px;padding:10px 16px;background:var(--panel-2);font-family:var(--font-mono);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);}
  .list-row{display:grid;grid-template-columns:1.1fr 2fr 1.2fr 1.3fr 1.1fr 1.1fr 0.9fr;gap:10px;align-items:center;padding:13px 16px 13px 19px;border-top:1px solid var(--line);width:100%;background:transparent;border-left:3px solid transparent;text-align:left;transition:background .1s,border-left-color .1s;}
  .list-row:hover{background:var(--panel-2);border-left-color:var(--ruby);}
  .list-empty{padding:40px 16px;text-align:center;font-size:14px;color:var(--text-mute);}
  .truncate{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .right{text-align:right;}

  .filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
  .search-box{display:flex;align-items:center;gap:8px;border:1px solid var(--line-strong);border-radius:8px;padding:8px 12px;background:var(--panel-2);transition:border-color .12s var(--ease);}
  .search-box:focus-within{border-color:var(--ruby);}
  .search-box input{border:none;outline:none;width:190px;font-size:13px;background:transparent;color:var(--text);}
  .filters select{border:1px solid var(--line-strong);border-radius:8px;padding:8px 12px;font-size:13px;background:var(--panel-2);color:var(--text);}

  .form-card{max-width:640px;padding:26px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .priority-row{display:flex;gap:8px;}
  .priority-btn{flex:1;border-radius:8px;padding:9px 0;font-family:var(--font-mono);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border:1px solid var(--line-strong);background:transparent;color:var(--text-dim);display:flex;align-items:center;justify-content:center;gap:6px;transition:border-color .12s,transform .1s;}
  .priority-btn:hover{border-color:var(--text-mute);transform:translateY(-1px);}
  .priority-btn.selected{border-color:currentColor;}
  .success-box{margin-bottom:18px;border-radius:8px;padding:12px 16px;background:rgba(111,227,196,.1);border:1px solid rgba(111,227,196,.3);display:flex;align-items:center;gap:10px;font-size:14px;color:var(--text);animation:cardIn .3s var(--ease) both;}

  .modal-overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:none;align-items:stretch;justify-content:flex-end;}
  .modal-overlay.show{display:flex;}
  .modal-panel{width:100%;max-width:520px;height:100%;overflow-y:auto;background:var(--bg1);padding:26px;animation:panelIn .2s var(--ease) both;border-left:1px solid var(--line);}
  @keyframes panelIn{ from{transform:translateX(24px);opacity:0;} to{transform:translateX(0);opacity:1;} }
  .modal-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:4px;}
  .modal-close{border:none;background:transparent;font-size:12px;font-weight:700;color:var(--text-dim);}
  .modal-close:hover{color:var(--text);}
  .modal-subject{font-family:var(--font-display);font-weight:800;font-size:23px;color:var(--text);margin-bottom:12px;}
  .badge-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px;}
  .meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:12px;margin-bottom:20px;}
  .meta-grid .k{font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-mute);}
  .meta-grid .v{font-weight:700;color:var(--text);margin-top:3px;}
  .desc-box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;font-size:14px;line-height:1.6;margin-bottom:22px;border-left:3px solid var(--ruby);color:var(--text);}
  .activity-title{font-family:var(--font-mono);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin-bottom:10px;}
  .activity-item{display:flex;gap:10px;font-size:12px;margin-bottom:12px;}
  .activity-item .txt{color:var(--text-dim);}
  .activity-item .txt b{color:var(--text);}
  .activity-item .who{color:var(--text-mute);margin-top:1px;font-family:var(--font-mono);font-size:11px;}
  .it-action{border:1px dashed var(--line-strong);border-radius:10px;padding:16px;}
  .quick-row{display:flex;gap:10px;margin-bottom:16px;}
  .quick-row .btn{flex:1;justify-content:center;}
  .status-flow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
  .status-btn{border-radius:4px;padding:6px 12px;font-family:var(--font-mono);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border:1px solid var(--line-strong);background:transparent;color:var(--text-dim);transition:border-color .12s,transform .1s;}
  .status-btn:hover{border-color:var(--text-mute);transform:translateY(-1px);}
  .status-btn.selected{border-color:currentColor;}
  .readonly-note{font-size:12px;background:var(--panel);border-radius:8px;padding:12px;color:var(--text-dim);border:1px dashed var(--line-strong);}

  .bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .bar-row .lab{width:112px;font-size:12px;color:var(--text);flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar-track{flex:1;height:8px;border-radius:4px;background:var(--panel-2);overflow:hidden;}
  .bar-fill{height:8px;border-radius:4px;transition:width .4s var(--ease);}
  .bar-n{width:24px;text-align:right;font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--text);}
  .scope-toggle{display:flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;}
  .scope-toggle button{border:none;padding:9px 16px;font-family:var(--font-mono);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;background:var(--panel-2);color:var(--text-dim);display:flex;align-items:center;gap:6px;}
  .scope-toggle button.active{background:var(--ruby);color:#1a0a05;}

  /* ---------- user management ---------- */
  .user-header{display:grid;grid-template-columns:1.3fr 1.5fr 1.5fr 1fr;gap:10px;padding:10px 16px;background:var(--panel-2);font-family:var(--font-mono);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);}
  .user-row{display:grid;grid-template-columns:1.3fr 1.5fr 1.5fr 1fr;gap:10px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);}
  .user-row .dept-badge{font-size:12px;font-weight:700;color:var(--text);}
  .pw-cell{display:flex;align-items:center;gap:8px;}
  .icon-btn{border:1px solid var(--line-strong);background:var(--panel-2);border-radius:6px;padding:6px 10px;font-size:12px;font-weight:700;color:var(--text);display:inline-flex;align-items:center;gap:5px;transition:transform .1s var(--ease),border-color .1s var(--ease);}
  .icon-btn:hover{transform:translateY(-1px);border-color:var(--text-mute);}
  .icon-btn:active{transform:translateY(0);}
  .icon-btn.danger{color:var(--ruby);border-color:rgba(255,90,60,.35);}
  .icon-btn.danger:hover{border-color:var(--ruby);}
  .row-actions{display:flex;gap:6px;}
  .add-user-card{padding:20px;margin-bottom:20px;}
  .add-user-grid{display:grid;grid-template-columns:1fr 1fr 1.3fr 1.3fr auto;gap:12px;align-items:end;}
  .u-err{font-size:12px;font-weight:700;color:var(--ruby);margin-top:8px;display:none;}
  .u-err.show{display:block;}
  .u-note{font-size:12px;color:var(--text-dim);margin-bottom:16px;line-height:1.5;}

  /* ---------- attachments ---------- */
  .attach-zone{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .attach-btn{display:inline-flex;align-items:center;gap:8px;border:1px dashed var(--line-strong);border-radius:8px;padding:9px 14px;font-size:13px;font-weight:600;color:var(--text-dim);cursor:pointer;transition:border-color .12s var(--ease),color .12s var(--ease);}
  .attach-btn:hover{border-color:var(--ruby);color:var(--text);}
  .attach-hint{font-size:11.5px;color:var(--text-mute);}
  .attach-list{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
  .attach-chip{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;}
  .attach-thumb{width:34px;height:34px;border-radius:6px;object-fit:cover;flex-shrink:0;background:var(--bg1);}
  .attach-thumb-file{display:flex;align-items:center;justify-content:center;color:var(--text-dim);}
  .attach-chip-meta{flex:1;min-width:0;}
  .attach-chip-name{font-size:12.5px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .attach-chip-size{font-size:11px;color:var(--text-mute);font-family:var(--font-mono);margin-top:1px;}
  .attach-chip-remove{border:none;background:transparent;color:var(--text-mute);display:flex;align-items:center;justify-content:center;padding:4px;border-radius:4px;flex-shrink:0;}
  .attach-chip-remove:hover{color:var(--ruby);background:rgba(255,90,60,.1);}
  .attach-actions{display:flex;gap:6px;flex-shrink:0;margin-left:auto;}
  .attach-actions .icon-btn{font-size:11.5px;padding:5px 9px;text-decoration:none;}
  @media (max-width: 900px){
    .attach-chip{flex-wrap:wrap;}
    .attach-actions{margin-left:0;width:100%;}
    .attach-actions .icon-btn{flex:1;justify-content:center;}
  }

  /* ---------- activity log ---------- */
  .activity-log-header{display:grid;grid-template-columns:1.3fr 1.2fr 1.1fr 1.3fr 2fr;gap:10px;padding:10px 16px;background:var(--panel-2);font-family:var(--font-mono);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);}
  .activity-log-row{display:grid;grid-template-columns:1.3fr 1.2fr 1.1fr 1.3fr 2fr;gap:10px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);}
  .activity-log-row:hover{background:var(--panel-2);}
  @media (max-width: 900px){
    .activity-log-header{display:none;}
    .activity-log-row{grid-template-columns:1fr;gap:4px;}
  }

  /* ---------- department picker / HR request kiosk ---------- */
  .back-link{border:none;background:transparent;display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:.03em;color:var(--text-dim);margin-bottom:16px;padding:0;transition:color .12s;}
  .back-link:hover{color:var(--ruby);}

  /* Dispatch-board department tiles — the signature element. Each
     card is a status panel: a code + LED dot up top identify the
     line, a plain colored icon and name sit below, and the border
     lights up to the department's own accent on hover, the way a
     dock bay's frame lights when it's selected. */
  .dept-tile-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
  .dept-tile{
    padding:22px 20px;display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:left;
    position:relative;overflow:hidden;background:var(--panel);
    animation:tileIn .3s var(--ease) both; animation-delay:calc(var(--stagger,0) * 40ms);
  }
  .dept-tile .tile-icon-badge{
    width:48px;height:48px;border-radius:13px;display:flex;align-items:center;justify-content:center;
    margin-bottom:16px;transition:transform .18s var(--ease);flex-shrink:0;
  }
  .dept-tile .tile-name{font-family:var(--font-display);font-weight:800;font-size:19px;color:var(--text);letter-spacing:.005em;}
  .dept-tile .tile-sub{font-family:var(--font-body);font-size:12.5px;color:var(--text-mute);margin-top:5px;line-height:1.4;}
  .dept-tile:hover{border-color:var(--accent, var(--line-strong));transform:translateY(-3px);}
  .dept-tile:hover .tile-icon-badge{transform:scale(1.08);}

  .hr-type-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
  .hr-type-btn{padding:16px 18px;display:flex;align-items:center;gap:14px;text-align:left;animation:tileIn .26s var(--ease) both;}
  .hr-type-btn:hover{border-color:var(--ruby);transform:translateY(-2px);}
  .hr-type-btn:hover .tile-icon{transform:scale(1.08);}
  .hr-type-btn .tile-icon{transition:transform .16s var(--ease);}
  .hr-type-btn .tile-icon{width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .hr-type-btn .tile-name{font-weight:700;font-size:14.5px;color:var(--text);}
  .dept-action-row{display:flex;gap:12px;flex-wrap:wrap;}
  .dept-action-card{flex:1;min-width:220px;padding:20px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;animation:tileIn .26s var(--ease) both;}
  .dept-action-card:hover{border-color:var(--ruby);transform:translateY(-3px);}
  .dept-action-card:hover .tile-icon{transform:scale(1.08);}
  .dept-action-card .tile-icon{transition:transform .16s var(--ease);}
  .dept-action-card .tile-icon{width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;}
  .dept-action-card .tile-name{color:var(--text);font-weight:700;font-size:14.5px;}
  .dept-action-card .tile-sub{color:var(--text-dim);font-family:var(--font-mono);font-size:10.5px;}

  @media (max-width: 1080px){ .dept-tile-grid{grid-template-columns:repeat(3,1fr);} }
  @media (max-width: 900px){
    .dept-tile-grid{grid-template-columns:repeat(2,1fr);}
    .hr-type-grid{grid-template-columns:1fr;}
    .stat-grid.g3, .stat-grid.g4{grid-template-columns:repeat(2,1fr);}
    .grid2{grid-template-columns:1fr;}
    .list-header, .user-header{display:none;}
    .list-row{grid-template-columns:1fr;gap:4px;}
    .user-row{grid-template-columns:1fr;gap:6px;}
    .add-user-grid{grid-template-columns:1fr;}
    .sidebar{width:200px;}
  }
</style>
</head>
<body>

async function kvGet(key){
  try{
    var res = await fetch('/api/kv/' + encodeURIComponent(key));
    if(res.ok){
      var data = await res.json();
      return (data && data.value != null) ? data.value : null;
    }
  }catch(e){ }
  try{ return localStorage.getItem(key); } catch(e){ return null; }
}
async function kvSet(key, value){
  try{
    var res = await fetch('/api/kv/' + encodeURIComponent(key), {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ value: value })
    });
    if(res.ok){
      try{ localStorage.setItem(key, value); } catch(e){}
      return;
    }
  }catch(e){ }
  try{ localStorage.setItem(key, value); } catch(e){ console.error('storage error', e); }
}

/* Fire-and-forget: appends one audit-trail entry (login/logout, ticket
   filed, ticket status changed, user added/edited/deleted) and persists
   it immediately so IT's Activity log stays current without the caller
   having to await it. actor/actorDept default to the current session
   when omitted, so most call sites only need to pass type + detail. */
function logActivity(type, detail, actorOverride, actorDeptOverride){
  var actor = actorOverride || (session ? session.username : 'Unknown');
  var actorDept = actorDeptOverride || (session ? session.department : '—');
  var entry = { id: uid(), type: type, actor: actor, actorDept: actorDept, detail: detail || '', at: new Date().toISOString() };
  loadActivity().then(function(current){
    var updated = [entry].concat(current);
    if(updated.length > 500) updated = updated.slice(0, 500);
    persistActivity(updated);
    activityLog = updated;
  });
}
function uid(){ return 'u_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }

function pad(n,len){ n=String(n); while(n.length<len) n='0'+n; return n; }
function ymd(d){ return ''+d.getFullYear()+pad(d.getMonth()+1,2)+pad(d.getDate(),2); }
function ymo(d){ return ''+d.getFullYear()+pad(d.getMonth()+1,2); }
function nextTicketNumber(list){
  var today = ymd(new Date());
  var count = list.filter(function(t){ return t.id.indexOf('-'+today+'-') !== -1; }).length;
  return 'GEMS-'+today+'-'+pad(count+1,3);
}
function fmtDateTime(iso){

}
function fmtDateOnly(iso){
  var d = new Date(iso);

}
function esc(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ============================================================
   ATTACHMENTS — lets anyone filing a request attach screenshots or
   files (e.g. an error photo) so IT/HR can see the actual problem.
   Files are read client-side and stored as base64 data URLs inside
   the ticket itself (the same JSON blob server.js already persists)
   so no separate upload endpoint is needed. Kept deliberately small:
   up to 3 files, 4MB each, per request.
============================================================ */
var ATTACH_MAX_FILES = 3;
var ATTACH_MAX_BYTES = 4 * 1024 * 1024;
var pendingAttachments = [];
function fmtFileSize(bytes){
  if(bytes < 1024) return bytes + ' B';
  if(bytes < 1024*1024) return Math.round(bytes/1024) + ' KB';
  return (bytes/(1024*1024)).toFixed(1) + ' MB';
}
function fileToDataUrl(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(){ resolve({ name:file.name, type:file.type, size:file.size, dataUrl:reader.result }); };
    reader.onerror = function(){ reject(new Error('Could not read file')); };
    reader.readAsDataURL(file);
  });
}
function clearAttachments(){
  pendingAttachments = [];
  var list = document.getElementById('attachment-list');
  if(list) list.innerHTML = '';
  var err = document.getElementById('attachment-err');
  if(err){ err.textContent=''; err.classList.remove('show'); }
}

  +   '</div>'
  +   '<div id="attachment-list" class="attach-list"></div>'

}

  return '<div class="attach-chip">'
    + preview
    + '<div class="attach-chip-meta"><div class="attach-chip-name">'+esc(file.name)+'</div><div class="attach-chip-size">'+fmtFileSize(file.size)+'</div></div>'
    + '<button type="button" class="attach-chip-remove" onclick="removeAttachment('+idx+')" aria-label="Remove">'+iconXSmall(13,'currentColor')+'</button>'
    + '</div>';
}
function renderAttachmentList(){
  var list = document.getElementById('attachment-list');
  if(!list) return;
  list.innerHTML = pendingAttachments.map(attachmentChipHtml).join('');
}
function removeAttachment(idx){
  pendingAttachments.splice(idx,1);
  renderAttachmentList();
}
function wireAttachmentInput(){
  var input = document.getElementById('attachment-input');
  if(!input) return;
  input.addEventListener('change', function(){
    var errEl = document.getElementById('attachment-err');
    var incoming = Array.prototype.slice.call(input.files || []);
    for(var i=0;i<incoming.length;i++){
      var f = incoming[i];
      if(pendingAttachments.length >= ATTACH_MAX_FILES){
        if(errEl){ errEl.textContent = 'You can attach up to '+ATTACH_MAX_FILES+' files.'; errEl.classList.add('show'); }
        break;
      }
      if(f.size > ATTACH_MAX_BYTES){
        if(errEl){ errEl.textContent = '"'+f.name+'" is over the 4MB limit and was skipped.'; errEl.classList.add('show'); }
        continue;
      }
      if(errEl){ errEl.textContent=''; errEl.classList.remove('show'); }
      pendingAttachments.push(f);
    }
    renderAttachmentList();
    input.value = '';
  });
}
async function resolveAttachmentsForSubmit(){
  if(!pendingAttachments.length) return [];
  return Promise.all(pendingAttachments.map(fileToDataUrl));
}

/* Per-department route accent + icon, used for the manifest-style tiles
   on the home screen and the sidebar. Kept centralized so the color
   used to paint a tile, its ribbon, and its route badge always match. */
function deptAccent(id){
  var map = {
    sales: '#ff5a3c', marketing: '#f2c94c', importation: '#4a90e2', admin: '#9a9ea6',
    hr: '#ffb454', accounting: '#d4a574', finance: '#b47fe0',
    production: '#ff7597', inventory: '#5cc9e0', it: '#6fe3c4'
  };
  return map[id] || '#ff5a3c';
}
function deptTileIcon(id, size, color){
  size = size || 22; color = color || '#fff';
  if(id==='it') return iconMonitor(size,color);
  if(id==='hr') return iconUsers(size,color);
  if(id==='accounting') return iconCalculator(size,color);
  if(id==='finance') return iconPieChart(size,color);
  if(id==='inventory') return iconCube(size,color);
  if(id==='production') return iconForklift(size,color);
  if(id==='importation') return iconTruck(size,color);
  if(id==='admin') return iconUserSingle(size,color);
  if(id==='sales') return iconTrendingUp(size,color);
  if(id==='marketing') return iconMegaphone(size,color);
  return diamondSvg(color,size*0.8);
}

function setLoginMode(m){
  loginMode = m;

function wireLoginEvents(){
  if(loginMode==='admin'){
    var form = document.getElementById('login-form');
    if(!form) return;
    form.addEventListener('submit', function(e){
      e.preventDefault();
      var errBox = document.getElementById('login-error');
      var u = document.getElementById('login-user').value.trim();
      var p = document.getElementById('login-pass').value;
      var match = users.filter(function(x){ return x.username===u && x.password===p && x.role!=='staff'; })[0];
      if(!match){
        errBox.textContent = 'Incorrect username or password.';
        errBox.classList.add('show');
        return;
      }
      errBox.classList.remove('show');
      var d = DEPARTMENTS.filter(function(x){ return x.id===match.deptId; })[0];
      var isItAdmin = !!(d && d.isAdmin);
      var isDeptAdmin = !isItAdmin && match.role==='deptAdmin';
      session = { department: d ? d.name : match.deptId, deptId: match.deptId, username:u, isAdmin: isItAdmin, isDeptAdmin: isDeptAdmin, userId:match.id, isStaffKiosk:false };
      activeTicketId = null;
      activeDeptId = null;
      activeHrType = null;
      activeHrGroup = null;
      selectedDeptId = null;
      view = 'dashboard';
      loginMode = 'choose';
      logActivity('login', (isItAdmin?'Signed in as IT Administrator':'Signed in as Department Admin'), u, session.department);
      render();
      refresh();
    });
  } else if(loginMode==='staff'){
    var sform = document.getElementById('staff-login-form');
    if(!sform) return;
    sform.addEventListener('submit', function(e){
      e.preventDefault();
      var errBox = document.getElementById('staff-login-error');
      var name = document.getElementById('staff-name').value.trim();
      if(!name){
        errBox.textContent = 'Please enter your name to continue.';
        errBox.classList.add('show');
        return;
      }
      if(!isAllowedStaffName(name)){
        errBox.textContent = 'This name is not recognized. Please check the spelling, or contact IT if you should have access.';
        errBox.classList.add('show');
        return;
      }
      errBox.classList.remove('show');
      session = { department:'Staff', deptId:null, username:name, isAdmin:false, isDeptAdmin:false, userId:null, isStaffKiosk:true };
      activeTicketId = null;
      activeDeptId = null;
      activeHrType = null;
      activeHrGroup = null;
      selectedDeptId = null;
      view = 'home';
      loginMode = 'choose';
      logActivity('login', 'Continued as staff (kiosk, no password)', name, 'Staff');
      render();
      refresh();
    });
  }
}

function animateTallies(){
  var nodes = document.querySelectorAll('.stat-card .val[data-tally]');
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  nodes.forEach(function(el, i){
    var target = parseInt(el.getAttribute('data-tally'), 10) || 0;
    if(reduceMotion || target === 0){ el.textContent = target; return; }
    var start = null;
    var duration = 550;
    var delay = i * 70;
    setTimeout(function(){
      function step(ts){
        if(start === null) start = ts;
        var progress = Math.min((ts - start) / duration, 1);
        var eased = 1 - Math.pow(1 - progress, 3);
        el.textContent = Math.round(eased * target);
        if(progress < 1) requestAnimationFrame(step);
        else el.textContent = target;
      }
      requestAnimationFrame(step);
    }, delay);
  });
}

function toggleHireEquip(cb){

function currentListSource(opts){
  var src = tickets;
  if(opts.scopeDept) src = src.filter(function(t){ return t.department===session.department; });
  if(opts.deptFilterName) src = src.filter(function(t){ return t.department===opts.deptFilterName; });
  if(opts.onlyOpenReview) src = src.filter(function(t){ return t.status==='Open' || t.status==='In Review'; });
  if(opts.requestType) src = src.filter(function(t){ return (t.requestType||'issue')===opts.requestType; });
  return src;
}
function listHtml(opts){
  window.__listOpts = opts;
  var deptOpts = DEPARTMENTS.map(function(d){ return '<option>'+esc(d.name)+'</option>'; }).join('');
  var statusOpts = STATUS_FLOW.map(function(s){ return '<option>'+esc(s)+'</option>'; }).join('');

  var filtersHtml = '';
  if(opts.filters){
    filtersHtml = '<div class="filters">'
      + '<div class="search-box">'+iconSearch(14,COLORS.slateLight)+'<input id="f-search" placeholder="Search ticket #, subject, or name"></div>'
      + '<select id="f-status"><option>All</option>'+statusOpts+'</select>'
      + ((opts.scopeDept || opts.deptFilterName) ? '' : '<select id="f-dept"><option>All</option>'+deptOpts+'</select>')
      + '</div>';
  }

  return ''
  + (opts.onBack ? ('<button type="button" class="back-link" onclick="'+opts.onBack+'()">&larr; Back</button>') : '')
  + '<div class="section-head"><div><div class="eyebrow">'+esc(opts.eyebrow)+'</div><div class="h-title">'+esc(opts.title)+'</div></div></div>'
  + filtersHtml
  + '<div class="card" id="list-body">'+listBodyHtml(opts)+'</div>';
}
function listBodyHtml(opts){
  var src = currentListSource(opts);
  var q = (document.getElementById('f-search') && document.getElementById('f-search').value || '').toLowerCase();
  var st = document.getElementById('f-status') ? document.getElementById('f-status').value : 'All';
  var dp = document.getElementById('f-dept') ? document.getElementById('f-dept').value : 'All';

  var filtered = src.filter(function(t){
    if(st!=='All' && t.status!==st) return false;
    if(dp && dp!=='All' && t.department!==dp) return false;
    if(q && (t.id+' '+t.subject+' '+(t.submittedBy||'')).toLowerCase().indexOf(q)===-1) return false;
    return true;
  });

  if(filtered.length===0) return '<div class="list-empty">No tickets match here yet.</div>';
  return listHeaderHtml() + filtered.map(rowHtml).join('');
}
function refilterList(){
  var body = document.getElementById('list-body');
  if(body && window.__listOpts) body.innerHTML = listBodyHtml(window.__listOpts);
}

function requestDetailsHtml(t){
  var rt = t.requestType||'issue';
  if(!t.details) return '';
  var rows = [];
  if(rt==='issue'){
    if(!t.details.subcategory) return '';
    rows = [['Subcategory', t.details.subcategory]];
  } else if(rt==='device'){
    rows = [
      ['Device type', t.details.deviceType],
      ['Quantity', t.details.quantity],
      ['For', t.details.forWhom || '—'],
      ['Needed by', t.details.neededBy ? fmtDateOnly(t.details.neededBy+'T00:00:00') : '—']
    ];
  } else if(rt==='access'){
    rows = [
      ['Request type', t.details.accessType],
      ['System / folder / account', t.details.target]
    ];
  } else if(rt==='newhire'){
    rows = [
      ['Employee name', t.details.employeeName],
      ['Position', t.details.position],
      ['Assigned department', t.details.assignedDept],
      ['Start date', t.details.startDate ? fmtDateOnly(t.details.startDate+'T00:00:00') : '—'],
      ['Equipment / accounts', (t.details.equipment && t.details.equipment.length) ? t.details.equipment.join(', ') : 'None specified']
    ];
  } else if(rt==='hr'){
    rows = [['HR request type', t.details.hrTypeLabel]];
    Object.keys(t.details).forEach(function(k){
      if(k==='hrType' || k==='hrTypeLabel') return;
      var label = HR_FIELD_LABEL[k] || (k.charAt(0).toUpperCase()+k.slice(1));
      var val = t.details[k];
      if(k==='date' || k==='dateFrom' || k==='dateTo'){ val = val ? fmtDateOnly(val+'T00:00:00') : '—'; }
      rows.push([label, val]);
    });
  }
  var grid = rows.map(function(r){
    return '<div><div class="k">'+esc(r[0])+'</div><div class="v">'+esc(r[1]||'—')+'</div></div>';
  }).join('');
  return '<div class="eyebrow" style="color:var(--slate);margin-bottom:10px;">'+esc(REQUEST_TYPE_LABEL[rt])+' DETAILS</div>'
    + '<div class="meta-grid" style="margin-bottom:20px;">'+grid+'</div>';
}

function closeModal(){ activeTicketId = null; document.getElementById('modal-root').innerHTML = ''; }

function renderModal(){
  var root = document.getElementById('modal-root');
  var t = tickets.filter(function(x){ return x.id===activeTicketId; })[0];
  if(!t){ root.innerHTML=''; return; }
  if(!modalStatus) modalStatus = t.status;

  var history = t.history.map(function(h){
    var c = STATUS_COLOR[h.status] || COLORS.slate;
    return '<div class="activity-item">'+dot(c)+'<div><div class="txt"><b>'+esc(h.status)+'</b> &mdash; '+esc(h.note)+'</div><div class="who">'+esc(h.by)+' &middot; '+fmtDateTime(h.at)+'</div></div></div>';
  }).join('');

  var canManage = session.isAdmin || (session.isDeptAdmin && t.department===session.department);
  var itAction = '';
  if(canManage){
    var quickRow = '';
    if(t.status==='Open' || t.status==='In Review'){
      quickRow = '<div class="quick-row">'
        + '<button type="button" class="btn btn-primary" onclick="quickSetStatus(\'Approved\')">Approve</button>'
        + '<button type="button" class="btn btn-muted" onclick="quickSetStatus(\'Rejected\')">Reject</button>'
        + '</div>';
    }
    var statusBtns = STATUS_FLOW.map(function(s){
      var c = STATUS_COLOR[s];
      var sel = s===modalStatus;
      return '<button type="button" class="status-btn'+(sel?' selected':'')+'" style="color:'+c+';'+(sel?('background:'+c+'1a;'):'')+'" onclick="setModalStatus(\''+s+'\')">'+esc(s)+'</button>';
    }).join('');
    itAction = ''
      + '<div class="it-action">'
      +   '<div class="eyebrow" style="color:var(--slate);margin-bottom:12px;">IT ACTION</div>'
      +   quickRow
      +   '<div class="status-flow" id="status-flow">'+statusBtns+'</div>'
      +   '<textarea class="input" id="modal-note" rows="3" placeholder="Remarks for this update (visible to the department)&hellip;" style="margin-bottom:12px;"></textarea>'
      +   '<button class="btn btn-dark" id="modal-save-btn" onclick="saveTicketUpdate()">'
      +     '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>'
      +     'Update ticket'
      +   '</button>'
      + '</div>';
  } else {
    itAction = '<div class="readonly-note">Only the IT team can change ticket status. You\'ll see updates here as they happen.</div>';
  }

  root.innerHTML = ''
  + '<div class="modal-overlay show" onclick="if(event.target===this) closeModal()">'
  +   '<div class="modal-panel">'
  +     '<div class="modal-top"><div class="mono" style="font-size:13px;font-weight:700;color:var(--ruby);">'+esc(t.id)+'</div><button class="modal-close" onclick="closeModal()">Close &times;</button></div>'
  +     '<div class="modal-subject">'+esc(t.subject)+'</div>'
  +     '<div class="badge-row">'+statusPill(t.status)+priorityTag(t.priority)+'<span class="cat-chip">'+esc(t.category)+'</span></div>'
  +     '<div class="meta-grid">'
  +       '<div><div class="k">Department</div><div class="v">'+esc(t.department)+'</div></div>'
  +       '<div><div class="k">Submitted by</div><div class="v">'+esc(t.submittedBy)+'</div></div>'
  +       '<div><div class="k">Filed</div><div class="v">'+fmtDateTime(t.createdAt)+'</div></div>'
  +     '</div>'
  +     requestDetailsHtml(t)
  +     '<div class="desc-box">'+esc(t.description)+'</div>'
  +     ticketAttachmentsHtml(t)
  +     '<div class="activity-title">ACTIVITY</div>'
  +     '<div style="margin-bottom:20px;">'+history+'</div>'
  +     itAction
  +   '</div>'
  + '</div>';
}
function setModalStatus(s){
  modalStatus = s;
  document.querySelectorAll('#status-flow .status-btn').forEach(function(btn){
    var label = btn.textContent.trim();
    var c = STATUS_COLOR[label];
    var sel = label===s;
    btn.classList.toggle('selected', sel);
    btn.style.background = sel ? (c+'1a') : 'transparent';
  });
}
function quickSetStatus(s){
  setModalStatus(s);
  var note = document.getElementById('modal-note');
  if(note) note.focus();
}
async function saveTicketUpdate(){
  var btn = document.getElementById('modal-save-btn');
  btn.disabled = true;
  var note = document.getElementById('modal-note').value.trim();
  var current = await loadTickets();
  var now = new Date().toISOString();
  var updated = current.map(function(t){
    if(t.id!==activeTicketId) return t;
    var h = t.history.slice();
    h.push({ status:modalStatus, note: note || ('Status changed to '+modalStatus+'.'), by:session.username, at:now });
    return Object.assign({}, t, { status:modalStatus, history:h });
  });
  await persistTickets(updated);
  tickets = updated;
  logActivity('ticket_status', 'Set '+activeTicketId+' to '+modalStatus+(note?(' — '+note):''));
  btn.disabled = false;
  renderModal();
  renderContent();
}

async function addUser(){
  var errEl = document.getElementById('add-user-err');
  errEl.classList.remove('show');
  var deptId = document.getElementById('nu-dept').value;
  var role = document.getElementById('nu-role').value;
  var username = document.getElementById('nu-user').value.trim();
  var password = document.getElementById('nu-pass').value;

  if(!username || !password){
    errEl.textContent = 'Enter a username and password.';
    errEl.classList.add('show');
    return;
  }
  var dup = users.filter(function(u){ return u.deptId===deptId && u.username.toLowerCase()===username.toLowerCase(); })[0];
  if(dup){
    errEl.textContent = 'That username already exists for this department.';
    errEl.classList.add('show');
    return;
  }

  var btn = document.getElementById('add-user-btn');
  btn.disabled = true;
  var current = await loadUsers();
  var newUser = { id: uid(), deptId: deptId, username: username, password: password, role: (deptId==='it'?'itAdmin':role), createdAt: new Date().toISOString() };
  var updated = current.concat([newUser]);
  await persistUsers(updated);
  users = updated;
  logActivity('user_added', 'Added account "'+username+'" ('+deptName(deptId)+')');
  btn.disabled = false;

  document.getElementById('nu-user').value = '';
  document.getElementById('nu-pass').value = '';
  document.getElementById('nu-role').value = 'deptAdmin';
  document.getElementById('user-table').innerHTML = userTableHtml();
}

async function saveEditUser(id){
  var newUsername = document.getElementById('edit-user-'+id).value.trim();
  var newPassword = document.getElementById('edit-pass-'+id).value;
  if(!newUsername || !newPassword){ return; }

  var current = await loadUsers();
  var target = current.filter(function(u){ return u.id===id; })[0];
  if(!target) return;
  var dup = current.filter(function(u){ return u.id!==id && u.deptId===target.deptId && u.username.toLowerCase()===newUsername.toLowerCase(); })[0];
  if(dup){ alert('That username already exists for this department.'); return; }

  var updated = current.map(function(u){ return u.id===id ? Object.assign({}, u, { username:newUsername, password:newPassword }) : u; });
  await persistUsers(updated);
  users = updated;
  logActivity('user_edited', 'Updated account for "'+deptName(target.deptId)+'" — now "'+newUsername+'"');
  editingUserId = null;
  document.getElementById('user-table').innerHTML = userTableHtml();
}

async function deleteUser(id){
  var target = users.filter(function(u){ return u.id===id; })[0];
  if(!target) return;
  if(target.deptId==='it'){
    var adminCount = users.filter(function(u){ return u.deptId==='it'; }).length;
    if(adminCount<=1){ alert('You can\'t delete the last IT admin account.'); return; }
  }
  if(!confirm('Remove the login for '+target.username+' ('+deptName(target.deptId)+')? This cannot be undone.')) return;

  var current = await loadUsers();
  var updated = current.filter(function(u){ return u.id!==id; });
  await persistUsers(updated);
  users = updated;
  logActivity('user_deleted', 'Deleted account "'+target.username+'" ('+deptName(target.deptId)+')');
  document.getElementById('user-table').innerHTML = userTableHtml();
}

/* ============================================================
   ACTIVITY LOG (IT only) — audit trail of logins, logouts, tickets
   filed, and user accounts added/edited/deleted.
============================================================ */
var ACTIVITY_TYPE_LABEL = {
  login:'Login', logout:'Logout', ticket_created:'Request filed',
  ticket_status:'Request updated', user_added:'User added',
  user_edited:'User edited', user_deleted:'User deleted'
};
var ACTIVITY_TYPE_COLOR = {
  login: COLORS.moss, logout: COLORS.slate, ticket_created: COLORS.signal,
  ticket_status: COLORS.amber, user_added: COLORS.moss,
  user_edited: COLORS.signal, user_deleted: COLORS.ruby
};
function activityTypeIcon(type, size, color){
  if(type==='login') return iconLoginArrow(size,color);
  if(type==='logout') return iconLogoutArrow(size,color);
  if(type==='ticket_created') return iconTicketSmall(size,color);
  if(type==='ticket_status') return iconHistory(size,color);
  if(type==='user_added') return iconUserPlus(size,color);
  if(type==='user_edited') return iconUserEditSmall(size,color);
  if(type==='user_deleted') return iconTrashSmall(size,color);
  return iconHistory(size,color);
}
function activityLogHtml(){
  var typeOpts = Object.keys(ACTIVITY_TYPE_LABEL).map(function(k){
    return '<option value="'+k+'"'+(activityFilterAction===k?' selected':'')+'>'+esc(ACTIVITY_TYPE_LABEL[k])+'</option>';
  }).join('');

  return ''
  + '<div class="section-head"><div><div class="eyebrow">IT administration</div><div class="h-title">Activity log</div></div></div>'
  + '<p class="u-note">Every sign-in, sign-out, request filed, and user account added, edited, or deleted is recorded here, most recent first, so you can trace what any user did and when. The log keeps the most recent 500 entries.</p>'
  + '<div class="filters">'
  +   '<div class="search-box">'+iconSearch(14,COLORS.slateLight)+'<input id="act-search" placeholder="Search by user"></div>'
  +   '<select id="act-type"><option value="All"'+(activityFilterAction==='All'?' selected':'')+'>All actions</option>'+typeOpts+'</select>'
  + '</div>'
  + '<div class="card" id="activity-body">'+activityBodyHtml()+'</div>';
}
function activityRowHtml(entry){
  var c = ACTIVITY_TYPE_COLOR[entry.type] || COLORS.slate;
  return '<div class="activity-log-row">'
    + '<div class="mono" style="font-size:11.5px;color:var(--text-mute);">'+fmtDateTime(entry.at)+'</div>'
    + '<div style="font-weight:700;font-size:13px;color:var(--text);">'+esc(entry.actor)+'</div>'
    + '<div style="font-size:12px;color:var(--text-dim);">'+esc(entry.actorDept)+'</div>'
    + '<div><span class="tag" style="color:'+c+';">'+activityTypeIcon(entry.type,12,c)+esc(ACTIVITY_TYPE_LABEL[entry.type]||entry.type)+'</span></div>'
    + '<div class="truncate" style="font-size:12.5px;color:var(--text-dim);">'+esc(entry.detail)+'</div>'
    + '</div>';
}
function activityBodyHtml(){
  var q = (document.getElementById('act-search') && document.getElementById('act-search').value || '').toLowerCase();
  var ty = document.getElementById('act-type') ? document.getElementById('act-type').value : 'All';
  var filtered = activityLog.filter(function(e){
    if(ty!=='All' && e.type!==ty) return false;
    if(q && (e.actor+' '+e.actorDept).toLowerCase().indexOf(q)===-1) return false;
    return true;
  });
  if(filtered.length===0) return '<div class="list-empty">No activity recorded yet.</div>';
  var header = '<div class="activity-log-header"><div>Time</div><div>User</div><div>Department</div><div>Action</div><div>Detail</div></div>';
  return header + filtered.map(activityRowHtml).join('');
}
function refilterActivity(){
  activityFilterAction = document.getElementById('act-type') ? document.getElementById('act-type').value : 'All';
  var body = document.getElementById('activity-body');
  if(body) body.innerHTML = activityBodyHtml();
}

    users = SEED_USERS.map(function(s){ return Object.assign({ id: uid(), createdAt: new Date().toISOString() }, s); });
